product:
  type: kmp/lib
  platforms: [ jvm, android ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.latex.renderer

dependencies@android:
  - $compose.uiTooling
  - $libs.androidx.activity.compose
  - $libs.firebase.auth
  - $libs.firebase.firestore
  - $libs.kotlinx.coroutines.play.services
  - $libs.androidx.credentials
  - $libs.androidx.credentials.play.services
  - $libs.googleid

test-dependencies:
  - $kotlin.test
  - junit:junit:4.13.1

settings:
  kotlin:
    serialization: json
  compose:
    enabled: true
    resources:
      packageName: kz.arctan.grepractice.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
